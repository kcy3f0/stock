name: Bug 回報
description: 回報可重現的錯誤或非預期行為
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感謝你協助改善專案。安全弱點請依 SECURITY.md 私下通報。
  - type: checkboxes
    attributes:
      label: 提交前檢查
      options:
        - label: 我已搜尋現有 Issue，沒有找到相同問題。
          required: true
        - label: 這不是需要私下通報的安全弱點。
          required: true
  - type: textarea
    attributes:
      label: 問題描述
      description: 請清楚說明實際發生的行為與影響。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 重現步驟
      placeholder: |
        1. 執行……
        2. 輸入……
        3. 看到……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: input
    attributes:
      label: 執行環境
      description: Node.js 版本、作業系統，以及 Discord 或瀏覽器版本。
      placeholder: Node.js 24、Windows 11、Discord Desktop
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日誌或補充資訊
      description: 貼上已移除 Token、個資與其他機密的相關資訊。
      render: shell
